<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe6ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Games" />
    <meta name="description" content="Little games for little ones." />
    <title>Games</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%88%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="book.css" />
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        font-display: swap;
        src: url('fonts/baloo-2-latin-800-normal.woff2') format('woff2');
      }
      :root {
        --ink: #5a4272;
        --safe-top: max(14px, env(safe-area-inset-top));
        --safe-bottom: max(14px, env(safe-area-inset-bottom));
        font-family: 'Baloo 2', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
        font-weight: 800;
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #bfe6ff;
      }
      .sky {
        position: fixed;
        inset: 0;
        background: linear-gradient(#9fd8ff, #d6f0ff 60%, #f3fbff);
      }
      .cloud {
        position: absolute;
        width: 24vmin;
        height: 7vmin;
        border-radius: 7vmin;
        background: #fff;
        opacity: 0.9;
        animation: drift linear infinite;
      }
      .cloud::before,
      .cloud::after {
        content: '';
        position: absolute;
        background: #fff;
        border-radius: 50%;
      }
      .cloud::before {
        width: 10vmin;
        height: 10vmin;
        left: 3vmin;
        top: -5vmin;
      }
      .cloud::after {
        width: 13vmin;
        height: 13vmin;
        left: 9vmin;
        top: -7vmin;
      }
      .hills {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34vh;
      }
      .hills svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      main {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vmin;
        padding: var(--safe-top) 16px var(--safe-bottom);
      }
      h1 {
        margin: 0;
        font-size: clamp(38px, 10vmin, 110px);
        line-height: 1;
        text-align: center;
      }
      h1 span {
        display: inline-block;
        -webkit-text-stroke: 0.14em #fff;
        paint-order: stroke fill;
        text-shadow: 0 0.09em 0 rgba(90, 66, 114, 0.22);
        animation: bounce 2.4s ease-in-out infinite;
      }
      /* Rows of five (three on a tall screen), the last row in the middle. */
      .games {
        --size: clamp(84px, min(26vmin, 14.5vw), 230px);
        --gap: 4vmin;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 3vmin var(--gap);
        max-width: calc(5 * var(--size) + 4 * var(--gap) + 1px);
      }
      @media (max-aspect-ratio: 1/1) {
        .games {
          --size: clamp(76px, min(27vw, 15vh), 250px);
          --gap: 4vw;
          row-gap: 2.4vh;
          max-width: calc(3 * var(--size) + 2 * var(--gap) + 1px);
        }
        h1 {
          font-size: clamp(38px, 12vw, 110px);
        }
        .game {
          font-size: clamp(16px, 4.4vw, 34px);
        }
      }
      /* A tall tablet has room for bigger tiles. */
      @media (max-aspect-ratio: 1/1) and (min-width: 600px) {
        .games {
          --size: clamp(84px, min(26vw, 16vh), 250px);
          --gap: 5vw;
        }
      }
      .game {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1vmin;
        color: var(--ink);
        text-decoration: none;
        font-size: clamp(16px, 4vmin, 34px);
        line-height: 1.1;
        text-align: center;
      }
      .tile {
        width: var(--size);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 26%;
        background: var(--bg);
        border: 0.7vmin solid #fff;
        box-shadow:
          0 1.2vmin 0 var(--edge),
          0 2vmin 3vmin rgba(90, 66, 114, 0.18);
        transition: transform 0.15s;
        animation: float 3.2s ease-in-out var(--d) infinite;
      }
      .tile {
        position: relative;
      }
      .game {
        width: var(--size);
      }
      /* The colouring game's name is written in its paints. */
      .rainbow {
        background: linear-gradient(90deg, #ff6b81, #ffa94d, #f5c742, #51cf66, #4dabf7, #9775fa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* How much each game's collection has grown. */
      .badge {
        position: absolute;
        top: -8%;
        right: -8%;
        min-width: 38%;
        padding: 0 0.3em;
        border-radius: 999px;
        background: #ffcf4d;
        border: 0.5vmin solid #fff;
        box-shadow: 0 0.5vmin 0 #e6a92e;
        color: var(--ink);
        font-size: clamp(16px, 4.4vmin, 36px);
        line-height: 1.5;
        text-align: center;
        white-space: nowrap;
      }
      .badge small {
        font-size: 0.6em;
        opacity: 0.75;
      }
      .tile svg {
        width: 74%;
        height: 74%;
        overflow: visible;
      }
      .game:active .tile,
      .game.go .tile {
        transform: scale(0.9);
        animation-play-state: paused;
      }
      @keyframes drift {
        from {
          transform: translateX(-30vmin);
        }
        to {
          transform: translateX(calc(100vw + 30vmin));
        }
      }
      @keyframes bounce {
        0%,
        70%,
        100% {
          transform: translateY(0);
        }
        80% {
          transform: translateY(-0.12em);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-1.2vmin);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        h1 span,
        .tile {
          animation: none;
        }
        .cloud {
          animation-play-state: paused;
        }
      }
    </style>
  </head>

      <div class="cloud" style="top: 8%; animation-duration: 95s; animation-delay: -55s; scale: 0.85"></div>

    <script type="module">
      // The child's name is shared with the games. The first visit on a
      // device asks for it (the same card the games use); change it later in
      // any game's grown-up settings.
      import { askName, storedName } from './ask-name.js';
      import { ctx, openBook, sfx, stuckCount, total, waiting } from './book.js';
      import { startPlayTimer } from './play-timer.js';

      // The grown-up's play timer (set in any game's settings): when the
      // time's up, the home page says goodnight too.
      startPlayTimer();

      const title = document.getElementById('title');
      const colours = ['#ff7a8a', '#ffb347', '#f5c742', '#7fcf6a', '#6ec3ff', '#b58cff', '#ff8fc8'];
      function paintTitle(name) {
        const text = name ? `${name}'s Games` : 'Games';
        title.replaceChildren();
        [...text].forEach((ch, i) => {
          const s = document.createElement('span');
          s.textContent = ch === ' ' ? '\u00a0' : ch;
          s.style.color = colours[i % colours.length];
          s.style.animationDelay = `${i * 0.08}s`;
          title.append(s);
        });
        title.setAttribute('aria-label', text);
        document.title = text;
      }
      const name = storedName();
      paintTitle(name ?? '');

      // A badge on each game: butterflies grown, treats baked, pictures
      // painted, kinds of fish found, pond friends met, presents found,
      // rubber ducks found, letters learned. Read from each game's own save.
      const read = (key) => {
        try {
          return JSON.parse(localStorage.getItem(key) || 'null') || {};
        } catch {
          return {};
        }
      };
      const counts = {
        'butterfly-garden/': [read('butterfly-garden.v1').butterflies?.length],
        'bakery/': [read('little-bakery.v1').treats?.length],
        'colour-splash/': [read('colour-splash.v1').paintings?.length],
        'fishing-pond/': [Object.keys(read('fishing-pond.v1').caught ?? {}).length, 12],
        'leapy-pond/': [read('leapy-pond.v1').friends?.length, 12],
        'unicorn-dash/': [read('unicorn-dash.v1').items?.length, 12],
        'ducky-bath/': [read('ducky-bath.v1').items?.length, 12],
        'postie-pip/': [read('postie-pip.v1').letters?.length, 26],
      };
      for (const [href, [n, of]] of Object.entries(counts)) {
        if (!n) continue;
        const b = document.createElement('span');
        b.className = 'badge';
        b.innerHTML = of ? `${n}<small>/${of}</small>` : String(n);
        document.querySelector(`a[href="${href}"] .tile`)?.append(b);
      }

      // Toddler-proofing: no zooming, scrolling or long-press menus.
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      // A happy pop, then off to the game.
      const pop = () => sfx.pop();
      for (const a of document.querySelectorAll('.game:not(.book-tile)')) {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          if (document.querySelector('.game.go')) return;
          a.classList.add('go');
          pop();
          setTimeout(() => (location.href = a.getAttribute('href')), 220);
        });
      }
      // Coming back with the browser's back button: un-press the tile, and
      // check for stickers earned in the game.
      addEventListener('pageshow', (e) => {
        document.querySelector('.game.go')?.classList.remove('go');
        if (e.persisted) showStickers();
      });

      // The sticker book: its tile shows how many stickers are in it, and
      // wobbles with a star when new ones are waiting to be stuck in.
      const bookTile = document.querySelector('.book-tile');
      function showStickers() {
        bookTile.querySelector('.tile').replaceChildren(bookTile.querySelector('.tile svg'));
        const n = stuckCount();
        const fresh = waiting().length;
        bookTile.classList.toggle('has-new', fresh > 0);
        if (n) {
          const b = document.createElement('span');
          b.className = 'badge';
          b.innerHTML = `${n}<small>/${total}</small>`;
          bookTile.querySelector('.tile').append(b);
        }
        if (fresh) {
          const star = document.createElement('span');
          star.className = 'new-star';
          star.textContent = '★';
          bookTile.querySelector('.tile').append(star);
        }
      }
      showStickers();

      // Each game's picture, for the top of its page in the book.
      const icons = {};
      for (const a of document.querySelectorAll('.game:not(.book-tile)')) {
        const tile = a.querySelector('.tile');
        icons[a.getAttribute('href').replace('/', '')] = {
          svg: tile.querySelector('svg').outerHTML,
          bg: tile.style.getPropertyValue('--bg'),
          edge: tile.style.getPropertyValue('--edge'),
        };
      }
      // The book is a step in the browser's history, so Back shuts it.
      let shutBook = null;
      function showBook() {
        if (shutBook) return;
        ctx();
        shutBook = openBook({
          icons,
          onClose: () => {
            shutBook = null;
            showStickers();
            if (history.state?.book) history.back();
          },
        });
      }
      bookTile.addEventListener('click', (e) => {
        e.preventDefault();
        if (shutBook) return;
        pop();
        history.pushState({ book: true }, '', '#stickers');
        showBook();
      });
      addEventListener('popstate', () => {
        if (history.state?.book) showBook();
        else shutBook?.();
      });
      if (location.hash === '#stickers') {
        history.replaceState(null, '', location.pathname + location.search);
        history.pushState({ book: true }, '', '#stickers');
        showBook();
      }

      // Save the games on this device so they work offline next time.
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      // A home-screen icon for "Add to Home Screen" (iOS wants a PNG).
      try {
        const svg = document.querySelector('.game .tile svg').outerHTML.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" ');
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = c.height = 180;
          const g = c.getContext('2d');
          g.fillStyle = '#d9f2ff';
          g.fillRect(0, 0, 180, 180);
          g.drawImage(img, 20, 20, 140, 140);
          const link = document.createElement('link');
          link.rel = 'apple-touch-icon';
          link.href = c.toDataURL('image/png');
          document.head.append(link);
        };
        img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      } catch {
        /* cosmetic only */
      }

      // First time on this device: who's playing?
      if (name === null) paintTitle(await askName());
    </script>
  </body>
</html>
